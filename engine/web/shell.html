<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGA Trek</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #aaa;
    font: 14px/1.4 ui-monospace, Menlo, monospace;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    box-sizing: border-box;
    padding: 8px;
    gap: 8px;
  }
  canvas {
    width: min(calc(100vw - 16px), calc((100dvh - 48px) * 4 / 3)) !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: calc(100dvh - 48px) !important;
    aspect-ratio: 4 / 3 !important;
    image-rendering: pixelated;
    outline: none;
  }
  p { margin: 0; text-align: center; }
</style>
</head>
<body>
<main>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <p id="status">Loading…</p>
</main>
<script>
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  var Module = {
    canvas,
    setStatus: (text) => { status.textContent = text || 'Click the screen to type. Shift-F1 is the boss key.'; },
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
  };
  canvas.addEventListener('click', () => canvas.focus());
</script>
{{{ SCRIPT }}}
</body>
</html>
